<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>Datamap</title>
<!--
  Derived from datamap-builder assets/custom_template.html (stock, unmodified base).
  Additions for the Suricata alert map:
    1. Columnar payload -> DATA.cols is a per-column store, dictionary-encoded where the
       column repeats ({d:[values], i:[index per point]}) and raw otherwise ({v:[...]}).
       Tooltips are BUILT here from DATA.hover_cols rather than shipped as 59,579
       pre-joined strings, which was 45% of the file. Same text, ~4x smaller.
    2. Click a point for a floating info card reading those structured fields.
    3. Legend for the --color-col facet.
    4. WebKit guard -> Safari emits gesturestart/change/end instead of ctrl+wheel,
       which broke pinch zoom on a previous map. Both paths handled, plus touch pinch.
    5. Click vs drag -> movement beyond a small threshold counts as a pan and does not
       spawn a card on release.
  Pan/zoom, search, hover tooltip and reset behaviour match the stock viewer.

  NOTE: the payload is injected with < > & escaped as \uXXXX. This corpus contains
  XSS-probe URIs holding a literal closing script tag; unescaped, the first one ends
  this script element and nothing runs. Do not "simplify" that escaping away.
  (This comment deliberately avoids writing that tag literally, so the document keeps
  exactly one script open/close pair -- which is what the notebook asserts.)
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a2e; --muted: #667; --panel: rgba(255,255,255,.92);
    --accent: #4a6cf7; --halo: rgba(255,255,255,.85);
  }
  .dark {
    --bg: #10101a; --fg: #e8e8f0; --muted: #99a; --panel: rgba(18,18,30,.92);
    --accent: #7f9cff; --halo: rgba(16,16,26,.85);
  }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position:absolute; inset:0; cursor:grab; touch-action:none; }
  #map.dragging { cursor:grabbing; }
  #header { position:absolute; top:14px; left:18px; z-index:5; pointer-events:none; }
  #header h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:.2px; }
  #header p { margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  #controls { position:absolute; top:14px; right:18px; z-index:5; display:flex; gap:8px; }
  #search { width:230px; padding:7px 11px; border-radius:8px; border:1px solid #8884;
    background:var(--panel); color:var(--fg); font-size:13px; outline:none; }
  #search:focus { border-color: var(--accent); }
  #tooltip { position:absolute; z-index:6; max-width:340px; padding:8px 11px; font-size:12.5px;
    line-height:1.45; background:var(--panel); color:var(--fg); border:1px solid #8883;
    border-radius:8px; pointer-events:none; display:none; box-shadow:0 4px 18px #0003;
    white-space:pre-wrap; word-wrap:break-word; }
  #footer { position:absolute; bottom:10px; left:18px; z-index:5; font-size:11px;
    color:var(--muted); pointer-events:none; }
  #resetBtn { padding:7px 11px; border-radius:8px; border:1px solid #8884; cursor:pointer;
    background:var(--panel); color:var(--fg); font-size:13px; }

  /* ---- colour legend ---- */
  #legend { position:absolute; z-index:5; right:18px; bottom:14px; padding:9px 11px;
    background:var(--panel); border:1px solid #8883; border-radius:9px; font-size:11.5px;
    line-height:1.6; box-shadow:0 4px 18px #0002; display:none; max-width:230px; }
  #legend .lgTitle { font-weight:700; font-size:11px; letter-spacing:.5px;
    text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  #legend .lgRow { display:flex; align-items:center; gap:7px; white-space:nowrap; }
  #legend .sw { width:10px; height:10px; border-radius:50%; flex:0 0 auto;
    box-shadow:0 0 0 1px #0003; }
  #legend .lgN { color:var(--muted); margin-left:auto; padding-left:10px; font-variant-numeric:tabular-nums; }

  /* ---- click-to-open info card ---- */
  #card { position:absolute; z-index:9; width:360px; max-width:calc(100vw - 24px);
    max-height:calc(100vh - 24px); overflow:auto; display:none;
    background:var(--panel); color:var(--fg); border:1px solid #8884; border-radius:11px;
    box-shadow:0 10px 40px #0006; font-size:12.5px; line-height:1.5;
    -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); }
  #card .cardHead { display:flex; align-items:flex-start; gap:8px; padding:11px 12px 9px;
    border-bottom:1px solid #8883; position:sticky; top:0; background:var(--panel);
    border-radius:11px 11px 0 0; }
  #card .cardSig { font-weight:700; font-size:13px; line-height:1.35; word-break:break-word; flex:1; }
  #card .cardClose { flex:0 0 auto; border:none; background:transparent; color:var(--muted);
    font-size:18px; line-height:1; cursor:pointer; padding:0 2px; border-radius:5px; }
  #card .cardClose:hover { color:var(--fg); background:#8882; }
  #card .cardBody { padding:9px 12px 12px; }
  #card .row { display:flex; gap:10px; padding:2.5px 0; align-items:baseline; }
  #card .k { flex:0 0 82px; color:var(--muted); font-size:11px; text-transform:uppercase;
    letter-spacing:.4px; }
  #card .v { flex:1; word-break:break-word; font-variant-numeric:tabular-nums; }
  #card .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:12px; }
  #card .sev { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px;
    font-weight:700; }
  #card .chip { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px;
    background:#8882; }
  #card .cardFoot { margin-top:9px; padding-top:8px; border-top:1px solid #8883;
    color:var(--muted); font-size:11px; word-break:break-all; }
  #card a.lookup { display:inline-flex; align-items:center; gap:5px; text-decoration:none;
    color:var(--accent); border:1px solid currentColor; border-radius:7px;
    padding:3px 9px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  #card a.lookup:hover { background:var(--accent); color:var(--bg); }
  #card a.lookup:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #card .lookupRow { margin-top:10px; padding-top:9px; border-top:1px solid #8883; }
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10101a">
<meta name="description" content="Interactive map of 59,579 deduplicated Suricata IDS/IPS alerts from four packet captures, with hierarchical cluster labels and per-alert rule lookups.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suricata Map">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  #boot { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:2em;
    font: 14px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#e8e8f0; background:#10101a; z-index:50; }
  #boot.err { max-width:none; }
  #boot code { background:#8883; padding:1px 5px; border-radius:4px; }
  #boot .spin { width:26px; height:26px; margin-bottom:14px; border-radius:50%;
    border:3px solid #8884; border-top-color:#4cc9f0; animation:sp 0.9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="header"><h1 id="title"></h1><p id="subtitle"></p></div>
<div id="controls">
  <input id="search" type="search" placeholder="Search points…" autocomplete="off">
  <button id="resetBtn" title="Reset view">⤾</button>
</div>
<canvas id="map"></canvas>
<div id="tooltip"></div>
<div id="legend"></div>
<div id="card" role="dialog" aria-label="Alert details" aria-modal="false">
  <div class="cardHead">
    <div class="cardSig" id="cardSig"></div>
    <button class="cardClose" id="cardClose" title="Close (Esc)" aria-label="Close">×</button>
  </div>
  <div class="cardBody" id="cardBody"></div>
</div>
<div id="boot"><div class="spin"></div><div>Loading 59,579 alerts…</div></div>
<div id="footer">scroll to zoom · drag to pan · click a point for details · Esc to close</div>
<script>
"use strict";
(async function boot() {
  const status = document.getElementById("boot");
  let DATA;
  try {
    const r = await fetch("data/datamap.json", { cache: "force-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  } catch (err) {
    status.innerHTML = "<b>Could not load the map data.</b><br><br>" +
      "This app must be served over HTTP(S) \u2014 opening index.html straight from " +
      "disk blocks the fetch.<br>Run <code>python3 -m http.server</code> in this " +
      "folder, or use the hosted URL.<br><br><small>" + String(err) + "</small>";
    status.className = "err";
    return;
  }
  status.remove();



if (DATA.darkmode) document.documentElement.classList.add("dark");
document.getElementById("title").textContent = DATA.title || "Datamap";
document.getElementById("subtitle").textContent = DATA.subtitle || "";
document.title = DATA.title || "Datamap";

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const pts = DATA.points;                 // [[x,y],...]
const N = pts.length;
const layers = DATA.label_layers || [];  // [{label:{x,y,n}}, ...] coarse->fine

// ---- columnar store -------------------------------------------------------
// Each column is either {d:[distinct values], i:[dict index per point]} or {v:[values]}.
// Dictionary encoding is what makes this file ~4x smaller than a row-of-dicts payload:
// `category` has 17 distinct values across 59,579 points, `source` has 4.
const COLS = DATA.cols || {};
const HOVER_COLS = DATA.hover_cols || [];

function colGet(col, i) {
  if (!col) return "";
  if (col.d) { const k = col.i[i]; return k == null ? "" : col.d[k]; }
  return col.v[i];
}
function field(name, i) { return colGet(COLS[name], i); }
function recordAt(i) {
  const o = {};
  for (const name in COLS) o[name] = colGet(COLS[name], i);
  return o;
}
// Decoded on demand; the pre-joined strings used to be 45% of the payload.
function hoverText(i) {
  const parts = [];
  for (const c of HOVER_COLS) {
    const v = colGet(COLS[c], i);
    if (v === "" || v === null || v === undefined) continue;  // omit empty fields,
    parts.push(c + ": " + v);                                 // matching the old tooltip
  }
  return parts.join(" | ").slice(0, DATA.hover_max_chars || 300);
}
function fineLabel(i) { return DATA.fine ? colGet(DATA.fine, i) : ""; }
function colorAt(i) { return DATA.colors ? colGet(DATA.colors, i) : "#5b7bd5"; }

// ---- data bounds & view state ----
// Full extent drives the hover grid; a percentile-trimmed extent drives the
// initial view. A handful of layout outliers otherwise push 99% of the points
// into a fifth of the canvas on reset. Outliers stay reachable by panning.
let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
for (const [x,y] of pts){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
const pad=(maxX-minX)*0.06||1; minX-=pad;maxX+=pad; const padY=(maxY-minY)*0.06||1; minY-=padY;maxY+=padY;

function pct(arr, p){
  const a=Float64Array.from(arr); a.sort();
  const i=Math.min(a.length-1, Math.max(0, Math.round((a.length-1)*p)));
  return a[i];
}
let vMinX=minX, vMaxX=maxX, vMinY=minY, vMaxY=maxY;
if(N>200){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  vMinX=pct(xs,0.005); vMaxX=pct(xs,0.995);
  vMinY=pct(ys,0.005); vMaxY=pct(ys,0.995);
  const px=(vMaxX-vMinX)*0.05||1, py=(vMaxY-vMinY)*0.05||1;
  vMinX-=px; vMaxX+=px; vMinY-=py; vMaxY+=py;
  if(!(vMaxX>vMinX&&vMaxY>vMinY)){ vMinX=minX;vMaxX=maxX;vMinY=minY;vMaxY=maxY; }
}
let view = null;
function resetView(){
  const w=canvas.width, h=canvas.height;
  const s=Math.min(w/(vMaxX-vMinX), h/(vMaxY-vMinY));
  view={s:s, tx:(w-(vMaxX+vMinX)*s)/2, ty:(h+(vMaxY+vMinY)*s)/2}; // y flipped
  scheduleDraw();
}
function toScreen(x,y){ return [x*view.s+view.tx, -y*view.s+view.ty]; }
function toData(px,py){ return [(px-view.tx)/view.s, -(py-view.ty)/view.s]; }
function zoomFactor(){ // 1 at reset, grows as user zooms in
  const s0=Math.min(canvas.width/(vMaxX-vMinX), canvas.height/(vMaxY-vMinY));
  return view.s/s0;
}
function zoomAt(px, py, factor){
  const [dx,dy]=toData(px,py);
  view.s*=factor;
  const [nsx,nsy]=toScreen(dx,dy);
  view.tx+=px-nsx; view.ty+=py-nsy;
  scheduleDraw();
}

// ---- spatial grid for hover ----
const GRID=128; let grid=null;
function buildGrid(){
  grid=new Array(GRID*GRID);
  const sx=GRID/(maxX-minX), sy=GRID/(maxY-minY);
  for(let i=0;i<N;i++){
    const gx=Math.min(GRID-1,Math.max(0,((pts[i][0]-minX)*sx)|0));
    const gy=Math.min(GRID-1,Math.max(0,((pts[i][1]-minY)*sy)|0));
    const k=gy*GRID+gx; (grid[k]||(grid[k]=[])).push(i);
  }
}
function nearest(px,py,rPix){
  const [dx,dy]=toData(px,py); const r=rPix/view.s;
  const sx=GRID/(maxX-minX), sy=GRID/(maxY-minY);
  const gx0=Math.max(0,((dx-r-minX)*sx)|0), gx1=Math.min(GRID-1,((dx+r-minX)*sx)|0);
  const gy0=Math.max(0,((dy-r-minY)*sy)|0), gy1=Math.min(GRID-1,((dy+r-minY)*sy)|0);
  let best=-1,bd=r*r;
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const cell=grid[gy*GRID+gx]; if(!cell)continue;
    for(const i of cell){
      const ddx=pts[i][0]-dx, ddy=pts[i][1]-dy, d=ddx*ddx+ddy*ddy;
      if(d<bd){bd=d;best=i;}
    }
  }
  return best;
}

// ---- search ----
// Dictionary-aware: for an encoded column we test the (small) distinct list and then
// sweep the index array, instead of rebuilding 59,579 concatenated strings per query.
let matchSet=null;
function markMatches(col, q, out){
  if(!col) return;
  if(col.d){
    const hits=new Set();
    for(let k=0;k<col.d.length;k++) if(String(col.d[k]).toLowerCase().includes(q)) hits.add(k);
    if(!hits.size) return;
    const idx=col.i;
    for(let i=0;i<idx.length;i++) if(hits.has(idx[i])) out.add(i);
  } else {
    const v=col.v;
    for(let i=0;i<v.length;i++) if(String(v[i]).toLowerCase().includes(q)) out.add(i);
  }
}
document.getElementById("search").addEventListener("input", e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){matchSet=null; scheduleDraw(); return;}
  const out=new Set();
  for(const c of HOVER_COLS) markMatches(COLS[c], q, out);
  markMatches(DATA.fine, q, out);
  matchSet=out;
  scheduleDraw();
});
document.getElementById("resetBtn").addEventListener("click", resetView);

// ---- legend ----
(function buildLegend(){
  const el=document.getElementById("legend");
  if(!DATA.legend || !DATA.legend.length) return;
  let html='<div class="lgTitle">'+esc(DATA.legend_title||"Source")+'</div>';
  for(const e of DATA.legend){
    html += '<div class="lgRow"><span class="sw" style="background:'+e.color+'"></span>'
          + '<span>'+esc(e.label)+'</span><span class="lgN">'+e.n.toLocaleString()+'</span></div>';
  }
  el.innerHTML=html; el.style.display="block";
})();

// ---- drawing ----
let drawQueued=false;
function scheduleDraw(){ if(!drawQueued){drawQueued=true; requestAnimationFrame(draw);} }
function pointRadius(){ const z=zoomFactor(); return Math.max(1, Math.min(6, 1+Math.log2(z)*1.2)); }
function draw(){
  drawQueued=false;
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const r=pointRadius();
  const dim=matchSet!==null;
  const baseAlpha = N>50000?0.35 : N>10000?0.55 : 0.8;
  // points
  for(let i=0;i<N;i++){
    const [sx,sy]=toScreen(pts[i][0],pts[i][1]);
    if(sx<-8||sy<-8||sx>w+8||sy>h+8) continue;
    const isMatch=dim&&matchSet.has(i);
    ctx.globalAlpha = dim ? (isMatch?0.95:0.06) : baseAlpha;
    ctx.fillStyle = isMatch ? "#ff5470" : colorAt(i);
    ctx.beginPath(); ctx.arc(sx,sy,r,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
  // selected point ring
  if(selected>=0){
    const [sx,sy]=toScreen(pts[selected][0],pts[selected][1]);
    if(sx>=-20&&sy>=-20&&sx<=w+20&&sy<=h+20){
      ctx.beginPath(); ctx.arc(sx,sy,Math.max(6,r+4),0,6.2832);
      ctx.strokeStyle="#ff5470"; ctx.lineWidth=2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(sx,sy,Math.max(6,r+4)+3,0,6.2832);
      ctx.strokeStyle="rgba(255,84,112,.35)"; ctx.lineWidth=2; ctx.stroke();
    }
  }
  // labels: pick layer by zoom (coarse when zoomed out)
  const z=zoomFactor();
  const layerIdx=Math.min(layers.length-1, z<2.2?0 : z<5?Math.min(1,layers.length-1) : layers.length-1);
  const cssVars=getComputedStyle(document.documentElement);
  const fg=cssVars.getPropertyValue("--fg").trim(), halo=cssVars.getPropertyValue("--halo").trim();
  const placed=[];
  const entries=Object.entries(layers[layerIdx]||{}).sort((a,b)=>b[1].n-a[1].n);
  for(const [label,info] of entries){
    const [sx,sy]=toScreen(info.x,info.y);
    if(sx<0||sy<0||sx>w||sy>h) continue;
    const fs=Math.max(11, Math.min(19, 10+Math.log2(info.n+1)));
    ctx.font=`600 ${fs}px -apple-system, "Segoe UI", sans-serif`;
    const tw=ctx.measureText(label).width;
    const box={x0:sx-tw/2-4,x1:sx+tw/2+4,y0:sy-fs,y1:sy+4};
    if(placed.some(b=>!(box.x1<b.x0||box.x0>b.x1||box.y1<b.y0||box.y0>b.y1))) continue;
    placed.push(box);
    ctx.textAlign="center"; ctx.lineJoin="round";
    ctx.strokeStyle=halo; ctx.lineWidth=4; ctx.strokeText(label,sx,sy);
    ctx.fillStyle=fg; ctx.fillText(label,sx,sy);
  }
}

// ---- info card ----
const cardEl   = document.getElementById("card");
const cardSig  = document.getElementById("cardSig");
const cardBody = document.getElementById("cardBody");
let selected = -1;

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SEV_COLOR = {"1":"#ff4d5e","2":"#ffa62b","3":"#4cc9f0"};
const SEV_NAME  = {"1":"1 · High","2":"2 · Medium","3":"3 · Low"};

function row(k, vHtml, cls){
  if(vHtml===""||vHtml==null) return "";
  return '<div class="row"><div class="k">'+esc(k)+'</div><div class="v'
       + (cls?" "+cls:"") + '">'+vHtml+'</div></div>';
}

function buildCardHtml(i){
  const rec = recordAt(i);
  cardSig.textContent = rec.signature || fineLabel(i) || "Alert";

  let html = "";
  html += row("Category", esc(rec.category));

  const sev = rec.severity===""||rec.severity==null ? "" : String(rec.severity);
  if(sev){
    html += row("Severity", '<span class="sev" style="background:'
              + (SEV_COLOR[sev]||"#8888aa") + ';color:#10101a">'
              + esc(SEV_NAME[sev]||sev) + '</span>');
  }

  // src -> dest, folded into one line when both sides are present
  const sIp=rec.src_ip||"", dIp=rec.dest_ip||"";
  const sPt=(rec.src_port===""||rec.src_port==null)?"":":"+rec.src_port;
  const dPt=(rec.dest_port===""||rec.dest_port==null)?"":":"+rec.dest_port;
  if(sIp||dIp){
    html += row("Src → Dst", esc(sIp+sPt) + ' <span style="color:var(--muted)">→</span> '
              + esc(dIp+dPt), "mono");
  }

  const protoBits = [rec.proto, rec.app_proto].filter(v=>v!==""&&v!=null);
  if(protoBits.length) html += row("Protocol", protoBits.map(p=>'<span class="chip">'+esc(p)+'</span>').join(" "));

  if(rec.hostname) html += row("Host", esc(rec.hostname), "mono");
  if(rec.uri)      html += row("URI", esc(String(rec.uri).slice(0,300)), "mono");
  if(rec.timestamp)html += row("First seen", esc(String(rec.timestamp).replace("T"," ").slice(0,19)), "mono");

  const cnt = rec.count;
  if(cnt!==""&&cnt!=null){
    const n = Number(cnt);
    html += row("Raw alerts", esc(isFinite(n)?n.toLocaleString():cnt)
              + (isFinite(n)&&n>1 ? ' <span style="color:var(--muted)">collapsed into this point</span>' : ''));
  }
  if(rec.source){
    const col = (DATA.legend||[]).find(e=>e.label===String(rec.source));
    html += row("Source", '<span class="sw" style="display:inline-block;width:9px;height:9px;'
              + 'border-radius:50%;background:'+(col?col.color:"#8888aa")+';margin-right:6px"></span>'
              + esc(rec.source));
  }
  // Per-point external lookup. Rendered as an explicit link the user must click --
  // a plain click on a point never navigates anywhere.
  const L = DATA.card_link;
  if(L){
    const v = String(rec[L.col] == null ? "" : rec[L.col]).trim();
    if(v){
      const href = L.url.replace("{v}", encodeURIComponent(v));
      html += '<div class="lookupRow"><a class="lookup" href="' + esc(href) + '"'
            + ' target="_blank" rel="noopener noreferrer nofollow external"'
            + ' title="Open the public rule page for ' + esc(L.label) + ' ' + esc(v) + '">'
            + esc(L.label) + ' ' + esc(v) + ' ↗</a></div>';
    }
  }

  const fl = fineLabel(i);
  if(fl) html += '<div class="cardFoot">Cluster: ' + esc(fl) + '</div>';
  if(!Object.keys(COLS).length){   // no columns in payload -> fall back to the tooltip text
    html = '<div style="white-space:pre-wrap">'+esc(hoverText(i))+'</div>';
  }
  cardBody.innerHTML = html;
}

function placeCard(px, py){
  cardEl.style.display="block";
  cardEl.style.left="0px"; cardEl.style.top="0px";   // measure unclamped
  const r = cardEl.getBoundingClientRect();
  const M = 12;
  let x = px + 16, y = py + 16;
  if(x + r.width  > window.innerWidth  - M) x = Math.max(M, px - r.width  - 16);
  if(y + r.height > window.innerHeight - M) y = Math.max(M, window.innerHeight - r.height - M);
  x = Math.max(M, Math.min(x, window.innerWidth  - r.width  - M));
  y = Math.max(M, Math.min(y, window.innerHeight - r.height - M));
  cardEl.style.left = x+"px"; cardEl.style.top = y+"px";
}

function openCard(i, px, py){
  if(i<0) return;
  selected = i;
  buildCardHtml(i);
  placeCard(px, py);
  tooltip.style.display="none";
  scheduleDraw();
}
function closeCard(){
  if(cardEl.style.display==="none" && selected<0) return;
  cardEl.style.display="none";
  selected=-1;
  scheduleDraw();
}
document.getElementById("cardClose").addEventListener("click", ev=>{ ev.stopPropagation(); closeCard(); });
window.addEventListener("keydown", e=>{ if(e.key==="Escape") closeCard(); });

// ---- interaction (mouse) ----
let dragging=false,lastX=0,lastY=0,moved=false,downX=0,downY=0,downT=0;
const CLICK_SLOP=4, CLICK_MS=600;

canvas.addEventListener("mousedown",e=>{
  dragging=true;moved=false;
  lastX=downX=e.clientX;lastY=downY=e.clientY;downT=Date.now();
  canvas.classList.add("dragging");
});
window.addEventListener("mouseup",e=>{
  canvas.classList.remove("dragging");
  const wasDragging=dragging; dragging=false;
  if(!wasDragging) return;
  const slop = Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY);
  const isClick = !moved && slop<=CLICK_SLOP && (Date.now()-downT)<CLICK_MS;
  if(!isClick) return;                       // it was a pan -> no card
  const i=nearest(e.clientX,e.clientY,12);
  if(i>=0) openCard(i, e.clientX, e.clientY);
  else closeCard();                          // click on empty space dismisses
});
// click-away: anything outside the canvas and outside the card closes it
window.addEventListener("mousedown", e=>{
  if(cardEl.style.display==="none") return;
  if(cardEl.contains(e.target)) return;
  if(e.target===canvas) return;              // canvas handled by the mouseup logic
  closeCard();
}, true);

window.addEventListener("mousemove",e=>{
  if(dragging){
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
    view.tx+=dx;view.ty+=dy;lastX=e.clientX;lastY=e.clientY;scheduleDraw();
    tooltip.style.display="none";
    return;
  }
  if(cardEl.style.display!=="none" && cardEl.contains(e.target)){
    tooltip.style.display="none"; return;    // don't tooltip through the card
  }
  const i=nearest(e.clientX,e.clientY,9);
  if(i>=0){
    tooltip.textContent=hoverText(i);
    tooltip.style.display="block";
    const tx=Math.min(e.clientX+14, window.innerWidth-360);
    tooltip.style.left=tx+"px"; tooltip.style.top=(e.clientY+14)+"px";
  } else tooltip.style.display="none";
});

canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  // ctrl+wheel is how Chrome/Firefox report trackpad pinch; same handler either way
  const f=Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016));
  zoomAt(e.clientX, e.clientY, f);
},{passive:false});

// ---- WebKit pinch: Safari fires gesture* instead of ctrl+wheel ----
let gestureScale=1, gestureX=0, gestureY=0;
canvas.addEventListener("gesturestart", e=>{
  e.preventDefault();
  gestureScale=e.scale||1;
  gestureX=e.clientX!==undefined?e.clientX:canvas.width/2;
  gestureY=e.clientY!==undefined?e.clientY:canvas.height/2;
},{passive:false});
canvas.addEventListener("gesturechange", e=>{
  e.preventDefault();
  const s=e.scale||1;
  if(gestureScale>0){
    const f=s/gestureScale;
    if(isFinite(f)&&f>0) zoomAt(gestureX, gestureY, f);
  }
  gestureScale=s;
},{passive:false});
canvas.addEventListener("gestureend", e=>{ e.preventDefault(); gestureScale=1; },{passive:false});
// Safari also zooms the whole document on pinch unless these are swallowed
document.addEventListener("gesturestart", e=>e.preventDefault(), {passive:false});
document.addEventListener("gesturechange", e=>e.preventDefault(), {passive:false});

// ---- touch: single-finger pan + tap, two-finger pinch ----
let touchMode=null, tLastX=0, tLastY=0, tDist=0, tMoved=false, tDownX=0, tDownY=0, tDownT=0;
function touchMid(t){ return [(t[0].clientX+t[1].clientX)/2, (t[0].clientY+t[1].clientY)/2]; }
function touchDist(t){ const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
  return Math.hypot(dx,dy); }

canvas.addEventListener("touchstart", e=>{
  const t=e.touches;
  if(t.length===1){
    touchMode="pan"; tMoved=false;
    tLastX=tDownX=t[0].clientX; tLastY=tDownY=t[0].clientY; tDownT=Date.now();
  } else if(t.length>=2){
    touchMode="pinch"; tDist=touchDist(t); tMoved=true;
  }
  e.preventDefault();
},{passive:false});

canvas.addEventListener("touchmove", e=>{
  const t=e.touches;
  if(touchMode==="pan" && t.length===1){
    const dx=t[0].clientX-tLastX, dy=t[0].clientY-tLastY;
    if(Math.abs(dx)+Math.abs(dy)>2) tMoved=true;
    view.tx+=dx; view.ty+=dy;
    tLastX=t[0].clientX; tLastY=t[0].clientY;
    scheduleDraw();
  } else if(touchMode==="pinch" && t.length>=2){
    const d=touchDist(t);
    if(tDist>0 && d>0){
      const [mx,my]=touchMid(t);
      zoomAt(mx, my, d/tDist);
    }
    tDist=d;
  }
  e.preventDefault();
},{passive:false});

canvas.addEventListener("touchend", e=>{
  if(touchMode==="pan" && !tMoved && (Date.now()-tDownT)<CLICK_MS){
    const i=nearest(tDownX, tDownY, 16);     // fatter hit radius for fingers
    if(i>=0) openCard(i, tDownX, tDownY); else closeCard();
  }
  if(e.touches.length===0) touchMode=null;
},{passive:false});

function resize(){
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  if(!view) resetView(); else scheduleDraw();
  if(cardEl.style.display!=="none" && selected>=0){
    const [sx,sy]=toScreen(pts[selected][0],pts[selected][1]);
    placeCard(sx, sy);
  }
}
window.addEventListener("resize",resize);
buildGrid(); resize();

})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW:", e));
  });
}
</script>
